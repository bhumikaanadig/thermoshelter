services:
  - type: web
    name: thermoshelter-api
    runtime: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: thermoshelter-df048
      - key: THERMOSHELTER_FIRESTORE_ENABLED
        value: "true"
      - key: THERMOSHELTER_CORS_ORIGINS
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/thermoshelter-service-account.json
